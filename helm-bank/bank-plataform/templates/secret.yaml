{{- $secrets := (index .Subcharts "bank-common").Values.secrets -}}
{{- if $secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: bank-secrets
  labels:
    app.kubernetes.io/name: bank-plataform
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  {{- toYaml $secrets.data | nindent 2 }}
{{- end }}
