deploymentName: cards
serviceName: cards
appLabel: cards

replicaCount: 1

image:
  repository: yanvelasco/cards
  tag: v7

imagePullPolicy: IfNotPresent
containerPort: 9000

service:
  enabled: true
  port: 9000
  targetPort: 9000

profileEnabled: true
configImportEnabled: true
eurekaEnabled: true
databaseEnabled: true
jwkEnabled: false
redisEnabled: false
kafkaEnabled: false
otelEnabled: true

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

startupProbe:
  tcpSocket:
    port: 9000
  periodSeconds: 10
  failureThreshold: 30

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 9000
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 9000
  periodSeconds: 15
