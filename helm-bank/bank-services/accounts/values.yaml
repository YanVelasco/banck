deploymentName: accounts
serviceName: accounts
appLabel: accounts

replicaCount: 1

image:
  repository: yanvelasco/accounts
  tag: v8

imagePullPolicy: IfNotPresent
containerPort: 8080

service:
  enabled: true
  port: 8080
  targetPort: 8080

profileEnabled: true
configImportEnabled: true
eurekaEnabled: true
databaseEnabled: true
jwkEnabled: false
redisEnabled: false
kafkaEnabled: true
otelEnabled: true

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

startupProbe:
  tcpSocket:
    port: 8080
  periodSeconds: 10
  failureThreshold: 30

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  periodSeconds: 15
