image: yanvelasco/loans:v7
imagePullPolicy: IfNotPresent
replicas: 1
containerPort: 8090
service:
  enabled: true
  port: 8090
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 768Mi
startupProbe:
  tcpSocket:
    port: 8090
  periodSeconds: 10
  failureThreshold: 30
readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8090
