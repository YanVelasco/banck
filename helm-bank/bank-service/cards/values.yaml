image: yanvelasco/cards:v7
imagePullPolicy: IfNotPresent
replicas: 1
containerPort: 9000
service:
  enabled: true
  port: 9000
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
startupProbe:
  tcpSocket:
    port: 9000
  periodSeconds: 10
  failureThreshold: 30
readinessProbe:
  httpGet:
    path: /actuator/health
    port: 9000
