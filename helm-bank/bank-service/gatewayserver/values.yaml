image: yanvelasco/gatewayserver:v5
imagePullPolicy: IfNotPresent
replicas: 1
containerPort: 8072
service:
  enabled: true
  type: NodePort
  port: 8072
  nodePort: 30072
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
startupProbe:
  tcpSocket:
    port: 8072
  periodSeconds: 10
  failureThreshold: 30
readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8072
