image: yanvelasco/accounts:v8
imagePullPolicy: IfNotPresent
replicas: 1
containerPort: 8080
service:
  enabled: true
  port: 8080
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
startupProbe:
  tcpSocket:
    port: 8080
  periodSeconds: 10
  failureThreshold: 30
readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8080