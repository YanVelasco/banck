image: yanvelasco/config-server:v4
imagePullPolicy: IfNotPresent
replicas: 1
containerPort: 8071
service:
  enabled: true
  port: 8071
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
startupProbe:
  httpGet:
    path: /actuator/health
    port: 8071
  periodSeconds: 10
  failureThreshold: 30
readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8071
