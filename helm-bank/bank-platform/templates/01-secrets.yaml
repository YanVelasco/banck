{{- $secrets := (index .Subcharts "bank-common").Values.secrets -}}
{{- if $secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: bank-secrets
  labels:
    {{- include "bank-common.commonLabels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml $secrets.data | nindent 2 }}
{{- end }}
