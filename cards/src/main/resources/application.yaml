server:
  port: 9000
spring:
  application:
    name: cards
  config:
    import:
      - "optional:configserver:http://localhost:8071/"
  profiles:
    active:
      - qa
  datasource:
    url: jdbc:mysql://localhost:3308/cardsdb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: bank
    password: bank
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8070/eureka/
  instance:
    hostname: localhost

info:
  app:
    name: cards
    description: Cards Service
    version: 1.0.0

logging:
  level:
    com:
      bank:
        cards: DEBUG
  pattern:
    level: "%5p[${spring.application.name},%X{trace_id},%X{span_id}] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %m%n"