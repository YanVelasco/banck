apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    orgId: 1
    url: http://loki:3100
    isDefault: true
    editable: true
    jsonData:
      httpHeaderName1: "X-Scope-OrgID"
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '\\[.+,(.+),.+\\]'
          name: traceID
          url: '$${__value.raw}'
    secureJsonData:
      httpHeaderValue1: "bank"