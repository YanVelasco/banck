server:
  port: 8080
spring:
  application:
    name: accounts
  config:
    import:
      - "optional:configserver:http://localhost:8071/"
  profiles:
    active:
      - qa
  datasource:
    url: jdbc:mysql://localhost:3306/accountsdb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: bank
    password: bank
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8070/eureka/
  instance:
    hostname: localhost

info:
  app:
    name: accounts
    description: Accounts Service
    version: 1.0.0