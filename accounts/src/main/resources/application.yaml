server:
  port: 8080
spring:
  application:
    name: accounts
  config:
    import:
      - "optional:configserver:http://localhost:8071/"
  profiles:
    active:
      - prod
  datasource:
    url: jdbc:h2:mem:testdbaccounts
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true