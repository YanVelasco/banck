server:
  port: 8080
spring:
  application:
    name: accounts
  config:
    import:
      - "optional:configserver:http://localhost:8071/"
  profiles:
    active:
      - prod
  datasource:
    url: jdbc:mysql://localhost:3306/accountsdb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: bank
    password: bank
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8070/eureka/
  instance:
    hostname: localhost

info:
  app:
    name: accounts
    description: Accounts Service
    version: 1.0.0

logging:
  level:
    com:
      bank:
        accounts: DEBUG

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 2
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2