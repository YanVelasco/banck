server:
  port: 8090
spring:
  application:
    name: loans
  config:
    import:
      - "optional:configserver:http://localhost:8071/"
  profiles:
    active:
      - qa
  datasource:
    url: jdbc:mysql://localhost:3307/loansdb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: bank
    password: bank
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8070/eureka/
  instance:
    hostname: localhost

info:
  app:
    name: loans
    description: Loans Service
    version: 1.0.0

logging:
  level:
    com:
      bank:
        loans: DEBUG
  pattern:
    level: "%5p[${spring.application.name},%X{trace_id},%X{span_id}] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %m%n"