apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: bank
spec:
  selector:
    app: config-server
  ports:
    - port: 8071
      targetPort: 8071
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: bank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: yanvelasco/config-server:v4
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - name: http
              containerPort: 8071
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -javaagent:/app/libs/opentelemetry-javaagent.jar
            - name: OTEL_SERVICE_NAME
              value: configserver
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_TRACES_EXPORTER
              value: otlp
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8071
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8071
---
apiVersion: v1
kind: Service
metadata:
  name: eurekaserver
  namespace: bank
spec:
  selector:
    app: eurekaserver
  ports:
    - port: 8070
      targetPort: 8070
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eurekaserver
  namespace: bank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eurekaserver
  template:
    metadata:
      labels:
        app: eurekaserver
    spec:
      containers:
        - name: eurekaserver
          image: yanvelasco/eurekaserver:v4
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - name: http
              containerPort: 8070
          envFrom:
            - configMapRef:
                name: bank-app-config
          env:
            - name: SPRING_APPLICATION_NAME
              value: eurekaserver
            - name: SPRING_CONFIG_IMPORT
              value: optional:configserver:http://config-server:8071/
            - name: JAVA_TOOL_OPTIONS
              value: -javaagent:/app/libs/opentelemetry-javaagent.jar
            - name: OTEL_SERVICE_NAME
              value: eurekaserver
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8070
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8070
---
apiVersion: v1
kind: Service
metadata:
  name: accounts
  namespace: bank
spec:
  selector:
    app: accounts
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts
  namespace: bank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounts
  template:
    metadata:
      labels:
        app: accounts
    spec:
      containers:
        - name: accounts
          image: yanvelasco/accounts:v8
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: bank-app-config
          env:
            - name: SPRING_APPLICATION_NAME
              value: accounts
            - name: SPRING_CONFIG_IMPORT
              value: configserver:http://config-server:8071/
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql-accounts:3306/accountsdb
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bank-secrets
                  key: mysql-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bank-secrets
                  key: mysql-password
            - name: JAVA_TOOL_OPTIONS
              value: -javaagent:/app/libs/opentelemetry-javaagent.jar
            - name: EUREKA_INSTANCE_HOSTNAME
              value: accounts
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "false"
            - name: OTEL_SERVICE_NAME
              value: accounts
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
---
