apiVersion: v1
kind: Service
metadata:
  name: mysql-accounts
  namespace: bank
spec:
  clusterIP: None
  selector:
    app: mysql-accounts
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-accounts
  namespace: bank
spec:
  serviceName: mysql-accounts
  replicas: 1
  selector:
    matchLabels:
      app: mysql-accounts
  template:
    metadata:
      labels:
        app: mysql-accounts
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bank-secrets
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: accountsdb
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: bank-secrets
                  key: mysql-username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bank-secrets
                  key: mysql-password
          startupProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
