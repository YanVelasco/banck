              value: public
            - name: MINIO_UPDATE
              value: "off"
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
