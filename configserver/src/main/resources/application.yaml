server:
  port: 8071
spring:
  application:
    name: configserver
  profiles:
    active:
      - git
  cloud:
    config:
      server:
        git:
          uri: https://github.com/YanVelasco/bank-config
          username: yanvelasco

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true